name: Go hello world

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Native example (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the reviewed native driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Query-farm/grainlift
          ref: 6d2e8cca9cc149cbc6352b87e5c1a0318cd7136c
          path: native-driver
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.11.7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.97.1
      - name: Check formatting and vet
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
      - name: Build the command and client example
        run: go build ./...
      - name: Unit tests
        run: go test -race -count=1 ./hello/ ./cmd/...
      - name: Build the native ADBC driver
        working-directory: native-driver
        run: cargo build --locked -p adbc-driver-grainlift
      - name: Native driver and Haybarn tests
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) export GRAINLIFT_DRIVER="$PWD/native-driver/target/debug/libadbc_driver_grainlift.dylib" ;;
            Linux) export GRAINLIFT_DRIVER="$PWD/native-driver/target/debug/libadbc_driver_grainlift.so" ;;
            *) exit 1 ;;
          esac
          test -f "$GRAINLIFT_DRIVER"
          # uvx runs the Haybarn CLI for examples/query.sql.
          export HAYBARN="uvx --from haybarn-cli>=1.5.5rc1 --prerelease allow haybarn"
          go test -race -count=1 -v ./...

  conformance:
    # The shared Grainlift worker conformance suite, through the native ADBC
    # driver, on every transport the conformance worker hosts.
    name: Shared worker conformance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the suite and native driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Query-farm/grainlift
          ref: 6d2e8cca9cc149cbc6352b87e5c1a0318cd7136c
          path: grainlift
          persist-credentials: false
      - name: Check out the Iroh bridge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Query-farm/vgi-rpc-rust
          ref: e60c342c2ae86730abe7a863f79cbd11f2f89910 # v0.27.3
          path: vgi-rpc-rust
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.11.7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.97.1
      - name: Build the conformance worker
        run: go build -o "$RUNNER_TEMP/conformance-worker" ./cmd/conformance-worker
      - name: Build the native ADBC driver
        working-directory: grainlift
        run: cargo build --locked --release -p adbc-driver-grainlift
      - name: Build the Iroh bridge
        working-directory: vgi-rpc-rust
        run: cargo build --locked --release -p vgi-iroh-bridge
      - name: Private TLS fixtures
        working-directory: grainlift
        run: bash validation/diagnostics/make_test_tls.sh "$RUNNER_TEMP/grainlift-tls"
      - name: Conformance on every transport
        working-directory: grainlift
        run: |
          for transport in http https tcp mtls iroh; do
            uv run --no-project --python 3.13 \
              --with pytest==9.1.1 --with pyarrow==25.0.1 \
              --with adbc-driver-manager==1.12.0 --with cryptography==50.0.1 \
              python -m pytest validation/conformance -q \
              --native-driver "$PWD/target/release/libadbc_driver_grainlift.so" \
              --worker-command "[\"$RUNNER_TEMP/conformance-worker\"]" \
              --worker-transport "$transport" \
              --worker-tls-dir "$RUNNER_TEMP/grainlift-tls" \
              --iroh-bridge "$PWD/../vgi-rpc-rust/target/release/vgi-iroh-bridge"
          done
