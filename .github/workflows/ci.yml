name: Go hello world

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Native example (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the reviewed native driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Query-farm/grainlift
          ref: e609935dff72a09d5ab63eddc5a4a7e88b6f61d4
          path: native-driver
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.11.7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1
      - name: Check formatting and vet
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
      - name: Build the command and client example
        run: go build ./...
      - name: Unit tests
        run: go test -race -count=1 ./hello/
      - name: Build the native ADBC driver
        working-directory: native-driver
        run: cargo build --locked -p adbc-driver-grainlift
      - name: Native driver and Haybarn tests
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) export GRAINLIFT_DRIVER="$PWD/native-driver/target/debug/libadbc_driver_grainlift.dylib" ;;
            Linux) export GRAINLIFT_DRIVER="$PWD/native-driver/target/debug/libadbc_driver_grainlift.so" ;;
            *) exit 1 ;;
          esac
          test -f "$GRAINLIFT_DRIVER"
          # uvx runs the Haybarn CLI for examples/query.sql.
          export HAYBARN="uvx --from haybarn-cli>=1.5.5rc1 --prerelease allow haybarn"
          go test -race -count=1 -v ./...
